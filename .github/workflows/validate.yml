name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest and Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/validate.py
      - run: docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint node ghcr.io/renovatebot/renovate:44.155.1 --test tests/renovate.test.mjs
      - run: docker run --rm -v "$PWD:/work" -w /work --entrypoint renovate-config-validator ghcr.io/renovatebot/renovate:44.155.1 --strict renovate.json

  install:
    name: Windows Scoop install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install through Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
          scoop bucket add letsrokk ([uri]$env:GITHUB_WORKSPACE).AbsoluteUri
          if ($LASTEXITCODE -ne 0) { throw 'Scoop bucket registration failed' }
          $shimDir = Split-Path (Get-Command scoop).Source
          $legacyAppDir = Join-Path (Split-Path $shimDir) 'apps\herdr-gpui\current'
          @("path = `"$env:SystemRoot\System32\conhost.exe`"", "args = --headless `"$legacyAppDir\herdr-gpui.exe`"") | Set-Content "$shimDir\herdr-gpui.shim"
          $installLog = scoop install letsrokk/herdr-gpui *>&1 | Out-String
          Write-Host $installLog
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed' }
          if ($installLog -match 'Overwriting shim') { throw 'Herdr shim must not conflict with its previous version' }
          scoop config last_update ([DateTime]::Now.ToString('o'))
          $updateLog = scoop update herdr-gpui --force *>&1 | Out-String
          Write-Host $updateLog
          if ($LASTEXITCODE -ne 0) { throw 'Scoop update failed' }
          if ($updateLog -match 'Overwriting shim') { throw 'Herdr shim must not conflict during updates' }
          if (-not (Get-Command herdr-gpui -ErrorAction SilentlyContinue)) { throw 'Command shim missing' }
          $shim = (Get-Command herdr-gpui).Source
          $shimConfig = Get-Content ([IO.Path]::ChangeExtension($shim, '.shim')) -Raw
          $appDir = scoop prefix herdr-gpui
          if ($shimConfig -notmatch '(?m)^path = ".*\\(?:System32|Sysnative)\\conhost\.exe"\r?$') { throw 'Shim must launch system conhost' }
          $expectedArgs = "--headless `"$appDir\herdr-gpui.exe`""
          if ($shimConfig -notmatch "(?m)^args = $([regex]::Escape($expectedArgs))\r?$") { throw 'Headless shim arguments incorrect' }
          $shortcut = "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Scoop Apps/Herdr.lnk"
          if (-not (Test-Path $shortcut)) { throw 'Start Menu shortcut missing' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.TargetPath -ne $shim) { throw 'Start Menu shortcut must use headless shim' }
          if ($link.IconLocation -ne "$appDir\icons\herdr.ico,0") { throw 'Start Menu shortcut must use Herdr icon' }
          Add-Type -AssemblyName System.Drawing
          $icon = [Drawing.Icon]::ExtractAssociatedIcon($shim)
          if (-not $icon) { throw 'Shim icon missing' }
          $actual = $icon.ToBitmap()
          $expectedIcon = [Drawing.Icon]::new("$appDir\icons\herdr.ico", $actual.Width, $actual.Height)
          $expected = $expectedIcon.ToBitmap()
          for ($y = 0; $y -lt $actual.Height; $y++) {
            for ($x = 0; $x -lt $actual.Width; $x++) {
              if ($actual.GetPixel($x, $y) -ne $expected.GetPixel($x, $y)) { throw 'Shim icon must match upstream artwork' }
            }
          }
          $expected.Dispose()
          $expectedIcon.Dispose()
          $actual.Dispose()
          $icon.Dispose()
